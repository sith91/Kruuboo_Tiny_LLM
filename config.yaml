# Tiny LLM Configuration

model:
  name: "tiny_llm"
  d_model: 384          # scaled up from 256
  n_heads: 6            # scaled up from 4 (keeps head_dim = 64)
  n_layers: 8           # scaled up from 6
  d_ff: 1536            # scaled up from 1024
  max_seq_len: 512      # BPE: 512 tokens for larger context window
  vocab_size: 8192      # Larger subword vocabulary target
  dropout: 0.1

training:
  batch_size: 8
  block_size: 512       # matches max_seq_len above
  max_iters: 8000       # more iterations for larger model
  learning_rate_max: 3e-4   # peak LR (cosine schedule)
  learning_rate_min: 1e-5   # floor LR at end of decay
  warmup_iters: 100     # linear warmup steps
  grad_clip: 1.0
  weight_decay: 0.1
  val_ratio: 0.1        # fraction held out for validation

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 500       # fits more context into larger window
  chunk_overlap: 50
  max_context_length: 1500
  default_k: 3

inference:
  temperature: 0.7
  max_tokens: 100
  use_rag: true

storage:
  knowledge_base_path: "knowledge_base"
  model_path: "models"
  tokenizer_path: "tokenizer.json"

wolfram:
  appid: "YOUR_WOLFRAM_APPID"
  enabled: true