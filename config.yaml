# Tiny LLM Configuration

model:
  name: "tiny_llm"
  d_model: 384          # 13.8M parameter right-sized SLM (~14MB INT8 footprint)
  n_heads: 6            # 6 attention heads (head_dim = 64)
  n_layers: 6           # 6 transformer layers
  d_ff: 1536            # SwiGLU hidden dimension
  max_seq_len: 512      # Context memory window: 512 tokens
  vocab_size: 8192      # Subword vocabulary target
  dropout: 0.05

training:
  batch_size: 8
  block_size: 512       # matches max_seq_len above
  max_iters: 1200       # iterations for full SFT convergence
  learning_rate_max: 6e-4   # peak LR (cosine schedule)
  learning_rate_min: 3e-5   # floor LR at end of decay
  warmup_iters: 60      # linear warmup steps
  grad_clip: 1.0
  weight_decay: 0.05
  val_ratio: 0.05       # fraction held out for validation

rag:
  embedding_model: "native"
  chunk_size: 800       # fits rich context into 1024 window
  chunk_overlap: 80
  max_context_length: 2500
  default_k: 3

inference:
  temperature: 0.7
  max_tokens: 100
  use_rag: true

storage:
  knowledge_base_path: "knowledge_base"
  model_path: "models"
  tokenizer_path: "tokenizer.json"

wolfram:
  appid: "YOUR_WOLFRAM_APPID"
  enabled: true

web_research:
  enabled: true
  auto_fallback: true   # Automatically trigger web fallback chain when local knowledge is insufficient
  max_results: 3
  # Fallback provider chain: executed in order until valid knowledge is retrieved
  providers:
    - wolfram        # Math & scientific calculations (if query matches math patterns)
    - duckduckgo     # Fast, unauthenticated instant answers & web summaries
    - wikipedia      # Detailed encyclopedic knowledge & article summaries
    - arxiv          # Academic research papers for science/AI/math queries
  
  duckduckgo:
    enabled: true
    timeout: 5

  wikipedia:
    enabled: true
    language: "en"
    max_results: 3

  wolfram:
    enabled: true
    appid: "YOUR_WOLFRAM_APPID"
    timeout: 5

  arxiv:
    enabled: true
    max_results: 2
    timeout: 5