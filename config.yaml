# Tiny LLM Configuration

model:
  name: "tiny_llm"
  d_model: 768          # 105M parameter / 100MB INT8 high-capacity SLM
  n_heads: 12           # 12 attention heads (head_dim = 64)
  n_layers: 14          # 14 transformer layers (100.5 MB INT8 footprint)
  d_ff: 3072            # SwiGLU hidden dimension
  max_seq_len: 1024     # Extended context memory window: 1024 tokens
  vocab_size: 8192      # Subword vocabulary target
  dropout: 0.1

training:
  batch_size: 8
  block_size: 1024      # matches max_seq_len above
  max_iters: 8000       # iterations for training
  learning_rate_max: 3e-4   # peak LR (cosine schedule)
  learning_rate_min: 1e-5   # floor LR at end of decay
  warmup_iters: 100     # linear warmup steps
  grad_clip: 1.0
  weight_decay: 0.1
  val_ratio: 0.1        # fraction held out for validation

rag:
  embedding_model: "all-MiniLM-L6-v2"
  chunk_size: 800       # fits rich context into 1024 window
  chunk_overlap: 80
  max_context_length: 2500
  default_k: 3

inference:
  temperature: 0.7
  max_tokens: 100
  use_rag: true

storage:
  knowledge_base_path: "knowledge_base"
  model_path: "models"
  tokenizer_path: "tokenizer.json"

wolfram:
  appid: "YOUR_WOLFRAM_APPID"
  enabled: true